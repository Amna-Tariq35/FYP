group 'com.deepar.ai'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
     namespace 'ai.deepar.deepar_flutter'
    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 23
    }
}

dependencies {
    // compileOnly so this library AAR does not take a direct local .aar dependency.
    // AGP refuses to bundle a plugin AAR that implementation/api-depends on a local
    // .aar. The app module packages the same file (see android/app/build.gradle.kts).
    def deeparAar = new File(rootProject.projectDir, "app/libs/deepar.aar")
    if (!deeparAar.exists()) {
        throw new GradleException(
            "DeepAR Android SDK not found at ${deeparAar}. " +
            "Keep deepar.aar at android/app/libs/deepar.aar."
        )
    }
    compileOnly files(deeparAar)
    implementation 'androidx.camera:camera-lifecycle:1.1.0-alpha01'
    implementation "androidx.camera:camera-camera2:1.1.0-alpha01"

}